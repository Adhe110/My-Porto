<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root { --ink: #17202a; --muted: #66717d; --orange: #f28b30; --cream: #f7f5f0; --line: #e5e2db; }
    html { scroll-padding-top: 5.5rem; }
    body { font-family: 'Poppins', sans-serif; background: var(--cream); color: var(--ink); }
    .text-brand { color: var(--orange); }
    nav { background: rgba(247,245,240,.9) !important; border-color: var(--line) !important; }
    nav a:hover { color: var(--orange) !important; }
    .project-card { display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 1rem; background: #fff; animation: rise .55s both; animation-delay: calc(var(--card-index) * 90ms); transition: transform .3s ease, box-shadow .3s ease; }
    .project-card:hover { transform: translateY(-7px); box-shadow: 0 1.5rem 3rem rgba(23,32,42,.1); }
    .project-media { height: 14rem; display: grid; place-items: center; padding: 1.5rem; background: #f0eee8; overflow: hidden; }
    .project-media img { width: 100%; height: 100%; object-fit: contain; transition: transform .4s ease; }
    .project-card:hover .project-media img { transform: scale(1.04); }
    .project-body { display: flex; flex: 1; flex-direction: column; padding: 1.5rem; }
    .eyebrow { margin: 0 0 .55rem; color: var(--orange); font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .project-body h3 { margin: 0; font-size: 1.45rem; letter-spacing: -.04em; }
    .project-description { flex: 1; margin: .8rem 0 1.2rem; color: var(--muted); font-size: .87rem; line-height: 1.75; }
    .tech-list { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1.3rem; }
    .tech-badge { border: 1px solid #d9d5cc; border-radius: 999px; padding: .3rem .6rem; color: #59636c; font-size: .67rem; font-weight: 600; }
    .project-actions { display: flex; flex-wrap: wrap; gap: 1rem; padding-top: 1rem; border-top: 1px solid #eeeae2; }
    .project-link { color: var(--orange); font-size: .78rem; font-weight: 700; }
    .project-link-dark { color: var(--ink); }
    .project-link:hover { color: #c46615; }
    .cursor-firework { position: fixed; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; }
    .firework-line { position: absolute; left: 0; top: 0; width: 3px; height: 14px; border-radius: 999px; background: var(--orange); transform-origin: 50% 100%; animation: firework-pop .65s cubic-bezier(.18,.75,.35,1) forwards; animation-delay: var(--spark-delay, 0ms); }
    .reveal { opacity: 0; transform: translateY(1.5rem); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.75,.25,1); }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }
    @keyframes rise { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: translateY(0); } }
    @keyframes firework-pop { 0% { opacity: 0; transform: rotate(var(--spark-angle)) translateY(0) scaleY(.25); } 20% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--spark-angle)) translateY(calc(var(--spark-distance) * -1)) scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
